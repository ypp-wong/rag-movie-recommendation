parameters:
  - name: appName
    type: string
  - name: azureSubscription
    type: string
  - name: packageName
    type: string
  - name: pythonVersion
    type: string

steps:
  - task: AzureWebApp@1
    displayName: "Deploy Python Application on Azure App Service" 
    inputs:
      appType: webAppLinux
      azureSubscription: ${{ parameters.azureSubscription }}
      appName: ${{ parameters.appName }}
      package: "$(Pipeline.Workspace)/drop/${{parameters.packageName}}.zip"
      deploymentMethod: 'zipDeploy'