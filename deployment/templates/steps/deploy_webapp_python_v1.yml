parameters:
  - name: appName
    type: string
  - name: azureSubscription
    type: string
  - name: packageName
    type: string
  - name: pythonVersion
    type: string

steps:
  - task: AzureCLI@2
    name: readSecret
    displayName: 'Reading SP Secret from Key Vault'
    inputs:
      azureSubscription: ${{ parameters.azureSubscription }}
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        secretRecord=$(az keyvault secret show --vault-name $(keyVaultName) --name $(secretName))
        secretValue=$(echo $secretRecord | grep -o '"value": ".*"' | cut -d '"' -f 4)
        echo "##vso[task.setvariable variable=client_secret;isOutput=true]$secretValue"

  - task: AzureWebApp@1
    displayName: "Deploy Python Application on Azure App Service" 
    inputs:
      appType: webAppLinux
      azureSubscription: ${{ parameters.azureSubscription }}
      appName: ${{ parameters.appName }}
      package: "$(Pipeline.Workspace)/drop/${{parameters.packageName}}.zip"
      deploymentMethod: 'zipDeploy'
      appSettings: >-
        -SA_COMMENTS_ENDPOINT_URL $(SA_COMMENTS_ENDPOINT_URL)
        -SA_DATA_LAKE_ENDPOINT_URL $(SA_DATA_LAKE_ENDPOINT_URL)
        -SA_STAGING_ENDPOINT_URL $(SA_STAGING_ENDPOINT_URL)
        -COMMENTS_CONTAINER $(SA_CONTAINER_NAME_COMMENTS)
        -JSON_TABLES_CONTAINER $(SA_CONTAINER_NAME_JSON_TABLES)
        -CACHE_CONTAINER $(SA_CONTAINER_NAME_CACHE)
        -CLIENT_SECRET $(SP_APP_SECRET)
        -CLIENT_ID $(SP_APP_ID)
        -TENANT_ID $(TENANT_ID)